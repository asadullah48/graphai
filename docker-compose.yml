version: '3.8'

services:
  graphai-gateway:
    build: .
    container_name: graphai-gateway
    ports:
      - "8010:8010"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: always
