[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphai"
version = "1.0.0"
description = "GraphAI: Enterprise DAG Workflow Orchestration, Branching, Approvals & Fault Recovery"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "GraphAI Orchestration Systems", email = "orchestration@graphai.dev" }]
keywords = ["dag-workflow", "agent-orchestration", "human-in-the-loop", "branching-logic", "exponential-retry", "parallel-agents"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
